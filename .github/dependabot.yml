# Weekly, grouped so a week's updates arrive as a few pull requests. Each one
# runs CI; merge it when it's green. A merge doesn't deploy: production ships
# from the maintainer's machine.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      tiptap:
        patterns: ["@tiptap/*"]
      supabase:
        patterns: ["@supabase/*"]
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
