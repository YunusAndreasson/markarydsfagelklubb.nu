# Verify every push and PR with `pnpm verify` — the same command as locally, so
# "it passed on my machine" and "CI is green" mean the same thing.
#
# Deliberately NOT here:
# - Deploys. Production ships from a developer machine with `pnpm ship`
#   (logged-in wrangler), so no Cloudflare credential lives in GitHub.
# - Database migrations. The Supabase project is shared with the live mobile
#   app (bird alerts included); `supabase db push` is a human act — see
#   docs/shared-database.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm BEFORE setup-node: `cache: pnpm` shells out to pnpm to find the
      # store. The version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Biome, `wrangler types` + `astro check`, Vitest, `astro build`.
      - run: pnpm verify
